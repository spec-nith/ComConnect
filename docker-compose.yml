x-backend-environment: &backend-environment
  NODE_ENV: development
  CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
  MONGO_URI: ${MONGO_URI:-mongodb://admin:admin123@mongodb:27017/comconnect?authSource=admin}
  DB_USERNAME: ${DB_USERNAME:-admin}
  DB_PASSWORD: ${DB_PASSWORD:-admin123}
  JWT_SECRET: ${JWT_SECRET:-local-development-secret}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
  AI_SERVICE_URL: http://ai-service:5001
  AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-ai-service-token}
  NOTIFICATION_SERVICE_URL: http://notification-service:5104
  REDIS_HOST: redis
  REDIS_PORT: 6379
  PRESENCE_TTL_SECONDS: 75
  MESSAGE_STREAM_KEY: chat:messages
  MESSAGE_STREAM_CONSUMER_GROUP: message-persistence
  MESSAGE_PERSIST_TIMEOUT_MS: 10000
  KNOWLEDGE_STREAM_KEY: workspace:knowledge
  KNOWLEDGE_DLQ_STREAM_KEY: workspace:knowledge:dead-letter
  KNOWLEDGE_STREAM_CONSUMER_GROUP: knowledge-indexing
  KNOWLEDGE_BACKFILL_BATCH_SIZE: 200
  KNOWLEDGE_BACKFILL_LEASE_MS: 600000
  WORKSPACE_SEARCH_RRF_K: 60
  DEEPGRAM_STT_API_KEY: ${DEEPGRAM_STT_API_KEY:-}
  DEEPGRAM_TTS_API_KEY: ${DEEPGRAM_TTS_API_KEY:-}
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  HUMAN_AGENT_NUMBER: ${HUMAN_AGENT_NUMBER:-}
  JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-8mb}
  KAFKA_BROKER: kafka:9092
  KAFKA_CLIENT_ID: notification-service
  KAFKA_GROUP_ID: notification-workers
  FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
  OPENSEARCH_ANALYTICS_ENABLED: ${OPENSEARCH_ANALYTICS_ENABLED:-true}
  OPENSEARCH_ANALYTICS_NODE: ${OPENSEARCH_ANALYTICS_NODE:-https://opensearch:9200}
  OPENSEARCH_ANALYTICS_USERNAME: ${OPENSEARCH_ANALYTICS_USERNAME:-admin}
  OPENSEARCH_ANALYTICS_PASSWORD: ${OPENSEARCH_ANALYTICS_PASSWORD:-C0mConnect!9vR7qP2zLx#2026}
  OPENSEARCH_ANALYTICS_INDEX: ${OPENSEARCH_ANALYTICS_INDEX:-comconnect-analytics-events}
  OPENSEARCH_ANALYTICS_SSL_REJECT_UNAUTHORIZED: ${OPENSEARCH_ANALYTICS_SSL_REJECT_UNAUTHORIZED:-false}

x-backend-service: &backend-service
  restart: unless-stopped
  environment: *backend-environment
  networks:
    - app_network
  depends_on:
    mongodb:
      condition: service_healthy

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app_network

  kafka:
    image: confluentinc/cp-kafka:7.4.1
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.19.1}
    restart: unless-stopped
    environment:
      cluster.name: comconnect-analytics
      node.name: comconnect-opensearch
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-C0mConnect!9vR7qP2zLx#2026}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -ksu admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200 >/dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - app_network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION:-2.19.1}
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: kibanaserver
      OPENSEARCH_PASSWORD: kibanaserver
      OPENSEARCH_SSL_VERIFICATIONMODE: none
      SERVER_HOST: "0.0.0.0"
    ports:
      - "5601:5601"
    networks:
      - app_network

  identity-service:
    <<: *backend-service
    image: comconnect-identity-service
    build:
      context: .
      dockerfile: backend/dockerfiles/identity.Dockerfile
    environment:
      <<: *backend-environment
      PORT: 5101
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-service:
    <<: *backend-service
    image: comconnect-chat-service
    build:
      context: .
      dockerfile: backend/dockerfiles/chat.Dockerfile
    environment:
      <<: *backend-environment
      PORT: 5102
    depends_on:
      mongodb:
        condition: service_healthy
      notification-service:
        condition: service_started
      redis:
        condition: service_healthy
      message-worker:
        condition: service_started

  message-worker:
    <<: *backend-service
    image: comconnect-message-worker
    build:
      context: .
      dockerfile: backend/dockerfiles/message-worker.Dockerfile
    environment:
      <<: *backend-environment
      PORT: 5106
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  knowledge-indexer:
    <<: *backend-service
    image: comconnect-knowledge-indexer
    build:
      context: .
      dockerfile: backend/dockerfiles/knowledge-indexer.Dockerfile
    environment:
      <<: *backend-environment
      PORT: 5107
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  task-service:
    <<: *backend-service
    image: comconnect-task-service
    build:
      context: .
      dockerfile: backend/dockerfiles/tasks.Dockerfile
    environment:
      <<: *backend-environment
      PORT: 5103
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    <<: *backend-service
    image: comconnect-notification-service
    build:
      context: .
      dockerfile: backend/dockerfiles/notifications.Dockerfile
    environment:
      <<: *backend-environment
      PORT: 5104
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ai-orchestrator:
    <<: *backend-service
    image: comconnect-ai-orchestrator
    build:
      context: .
      dockerfile: backend/dockerfiles/ai-orchestrator.Dockerfile
    environment:
      <<: *backend-environment
      PORT: 5105
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-ai-service-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      OPENAI_EMBEDDING_API_KEY: ${OPENAI_EMBEDDING_API_KEY:-}
      OPENAI_EMBEDDING_BASE_URL: ${OPENAI_EMBEDDING_BASE_URL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      VECTOR_STORE_BACKEND: chroma
      AI_WORKERS: 1
      CHROMA_DIR: /data/chroma-ollama
      RETRIEVAL_CANDIDATE_LIMIT: ${RETRIEVAL_CANDIDATE_LIMIT:-40}
      RRF_K: ${RRF_K:-60}
      AI_MODEL_TIMEOUT_SECONDS: ${AI_MODEL_TIMEOUT_SECONDS:-180}
      AI_HTTP_TIMEOUT_SECONDS: ${AI_HTTP_TIMEOUT_SECONDS:-240}
      AI_AGENT_RECURSION_LIMIT: ${AI_AGENT_RECURSION_LIMIT:-12}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-comconnect-ai}
    volumes:
      - chroma_data:/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      IDENTITY_SERVICE_URL: http://identity-service:5101
      CHAT_SERVICE_URL: http://chat-service:5102
      TASK_SERVICE_URL: http://task-service:5103
      NOTIFICATION_SERVICE_URL: http://notification-service:5104
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:5105
      MESSAGE_WORKER_SERVICE_URL: http://message-worker:5106
    depends_on:
      - identity-service
      - chat-service
      - task-service
      - notification-service
      - ai-orchestrator
      - message-worker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_SOCKET_URL: http://localhost:5000
      REACT_APP_OPENSEARCH_DASHBOARDS_URL: http://localhost:5601
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  chroma_data:
  opensearch_data:

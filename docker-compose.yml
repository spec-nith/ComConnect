services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    # Port mapping removed - Kafka accesses Zookeeper via Docker network
    # ports:
    #   - "2181:2181"
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.4.1
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # Port mappings removed - services access Kafka via Docker network
    # ports:
    #   - "9092:9092"
    #   - "29092:29092"
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - POSTGRES_DB=${POSTGRES_DB:-comconnect}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d comconnect"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Cassandra Database
  cassandra:
    image: cassandra:4.1
    environment:
      - CASSANDRA_CLUSTER_NAME=ComConnectCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q UN"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # MongoDB - Kept for task-service and notification-service
  mongodb:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD:-admin123}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME:-comconnect}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "no"]
    # Port mapping removed - services access Redis via Docker network
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Elasticsearch - Search and Analytics
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Kibana - Elasticsearch UI (Optional but recommended)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # API Gateway - Port 8080
  api-gateway:
    build:
      context: ./backend/services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - app_network
    depends_on:
      user-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
      workspace-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      websocket-gateway:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # WebSocket Gateway - Port 5007
  websocket-gateway:
    build:
      context: ./backend/services
      dockerfile: websocket-gateway/Dockerfile
    ports:
      - "5007:5007"
    networks:
      - app_network
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WEBSOCKET_GATEWAY_PORT=5007
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - MESSAGE_SERVICE_URL=http://message-service:5003
      - USER_MANAGEMENT_SERVICE_URL=http://user-management-service:5009
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:4318/v1/traces}
    volumes:
      - ./backend/services/websocket-gateway:/app
      - ./backend/services/shared:/app/shared
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      message-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M

  # User Service - Port 5001
  user-service:
    build:
      context: ./backend/services
      dockerfile: user-service/Dockerfile
    ports:
      - "5001:5001"
    networks:
      - app_network
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - USER_SERVICE_PORT=5001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/comconnect
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - POSTGRES_DB=${POSTGRES_DB:-comconnect}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
    volumes:
      - ./backend/services/user-service:/app
      - ./backend/services/shared:/app/shared
      - /app/node_modules
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Chat Service - Port 5002
  chat-service:
    build:
      context: ./backend/services
      dockerfile: chat-service/Dockerfile
    ports:
      - "5002:5002"
    networks:
      - app_network
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - CHAT_SERVICE_PORT=5002
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - CASSANDRA_CONTACT_POINTS=cassandra
      - CASSANDRA_LOCAL_DATACENTER=datacenter1
      - CASSANDRA_KEYSPACE=comconnect
      - CASSANDRA_USERNAME=${CASSANDRA_USERNAME:-}
      - CASSANDRA_PASSWORD=${CASSANDRA_PASSWORD:-}
      - USER_SERVICE_URL=http://user-service:5001
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:9092}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID:-chat-service}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID:-chat-service-group}
      - KAFKAJS_NO_PARTITIONER_WARNING=1
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:4318/v1/traces}
    volumes:
      - ./backend/services/chat-service:/app
      - ./backend/services/shared:/app/shared
      - /app/node_modules
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      user-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Message Service - Port 5003 (with Socket.IO)
  message-service:
    build:
      context: ./backend/services
      dockerfile: message-service/Dockerfile
    ports:
      - "5003:5003"
    networks:
      - app_network
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - MESSAGE_SERVICE_PORT=5003
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - CASSANDRA_CONTACT_POINTS=cassandra
      - CASSANDRA_LOCAL_DATACENTER=datacenter1
      - CASSANDRA_KEYSPACE=comconnect
      - CASSANDRA_USERNAME=${CASSANDRA_USERNAME:-}
      - CASSANDRA_PASSWORD=${CASSANDRA_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - NOTIFICATION_SERVICE_URL=http://notification-service:5006
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - KAFKA_BROKER=kafka:9092
      - KAFKA_CLIENT_ID=message-service
      - KAFKA_GROUP_ID=message-persistence-group
      - KAFKAJS_NO_PARTITIONER_WARNING=1
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:4318/v1/traces}
    volumes:
      - ./backend/services/message-service:/app
      - ./backend/services/shared:/app/shared
      - /app/node_modules
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      notification-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M

  # Workspace Service - Port 5004
  workspace-service:
    build:
      context: ./backend/services
      dockerfile: workspace-service/Dockerfile
    ports:
      - "5004:5004"
    networks:
      - app_network
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WORKSPACE_SERVICE_PORT=5004
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/comconnect
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - POSTGRES_DB=${POSTGRES_DB:-comconnect}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:4318/v1/traces}
    volumes:
      - ./backend/services/workspace-service:/app
      - ./backend/services/shared:/app/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Task Service - Port 5005
  task-service:
    build:
      context: ./backend/services
      dockerfile: task-service/Dockerfile
    ports:
      - "5005:5005"
    networks:
      - app_network
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - TASK_SERVICE_PORT=5005
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - MONGO_URI=${MONGO_URI:-mongodb://admin:admin123@mongodb:27017/comconnect?authSource=admin}
      - DB_USERNAME=${DB_USERNAME:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:4318/v1/traces}
    volumes:
      - ./backend/services/task-service:/app
      - ./backend/services/shared:/app/shared
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Notification Service - Port 5006
  notification-service:
    build:
      context: ./backend/services
      dockerfile: notification-service/Dockerfile
    ports:
      - "5006:5006"
    networks:
      - app_network
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NOTIFICATION_SERVICE_PORT=5006
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - MONGO_URI=${MONGO_URI:-mongodb://admin:admin123@mongodb:27017/comconnect?authSource=admin}
      - DB_USERNAME=${DB_USERNAME:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:9092}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID:-notification-service}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID:-notification-group}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:4318/v1/traces}
    volumes:
      - ./backend/services/notification-service:/app
      - ./backend/services/shared:/app/shared
      - /app/node_modules
      - ./backend/services/notification-service/config/comconnect-2b1d7-firebase-adminsdk-20r1n-c127902f6f.json:/app/config/comconnect-2b1d7-firebase-adminsdk-20r1n-c127902f6f.json
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M

  # Media Upload Service - Port 5008
  media-upload-service:
    build:
      context: ./backend/services
      dockerfile: media-upload-service/Dockerfile
    ports:
      - "5008:5008"
    networks:
      - app_network
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - MEDIA_UPLOAD_SERVICE_PORT=5008
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-comconnect-media}
      - CDN_DOMAIN=${CDN_DOMAIN:-}
      - AWS_CLOUDFRONT_DOMAIN=${AWS_CLOUDFRONT_DOMAIN:-}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:4318/v1/traces}
    volumes:
      - ./backend/services/media-upload-service:/app
      - ./backend/services/shared:/app/shared
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M

  # User Management Service - Port 5009
  user-management-service:
    build:
      context: ./backend/services
      dockerfile: user-management-service/Dockerfile
    ports:
      - "5009:5009"
    networks:
      - app_network
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - USER_MANAGEMENT_SERVICE_PORT=5009
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - USER_SERVICE_URL=http://user-service:5001
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:4318/v1/traces}
    volumes:
      - ./backend/services/user-management-service:/app
      - ./backend/services/shared:/app/shared
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Grafana - Metrics Visualization (Optional but recommended)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
      - "4318:4318"    # OTLP HTTP receiver
      - "4317:4317"    # OTLP gRPC receiver
      - "6831:6831/udp"  # Jaeger agent UDP
      - "6832:6832/udp"  # Jaeger agent UDP
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - app_network
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
      - REACT_APP_SOCKET_URL=http://localhost:5007
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - /app/frontend/node_modules

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  cassandra_data:
  mongodb_data:
  elasticsearch_data:

networks:
  app_network:
    driver: bridge

# API Gateway Nginx Configuration

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# Upstream services
upstream user_service {
    server user-service:5001;
    keepalive 32;
}

upstream chat_service {
    server chat-service:5002;
    keepalive 32;
}

upstream message_service {
    server message-service:5003;
    keepalive 32;
}

upstream workspace_service {
    server workspace-service:5004;
    keepalive 32;
}

upstream task_service {
    server task-service:5005;
    keepalive 32;
}

upstream notification_service {
    server notification-service:5006;
    keepalive 32;
}

# Main server block
server {
    listen 80;
    server_name api-gateway;
    
    # Logging
    access_log /var/log/nginx/api-gateway-access.log;
    error_log /var/log/nginx/api-gateway-error.log warn;
    
    # Client body size limit
    client_max_body_size 10M;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # CORS headers - Let services handle CORS, but add basic support here
    # Services have their own CORS configuration, so we just pass through
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "API Gateway is healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Gateway status endpoint
    location /gateway/status {
        access_log off;
        return 200 "{\"status\":\"ok\",\"service\":\"api-gateway\",\"timestamp\":\"$time_iso8601\"}\n";
        add_header Content-Type application/json;
    }
    
    # User Service Routes with Versioning Support
    location ~ ^/api/v(\d+)/user {
        set $version $1;
        limit_req zone=api_limit burst=20 nodelay;
        
        # Rewrite to remove version for service routing
        rewrite ^/api/v\d+/(.*)$ /api/$1 break;
        
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v$version";
        
        # Special rate limiting for auth endpoints
        if ($request_uri ~* "/api/v\d+/user/login|/api/v\d+/user$") {
            limit_req zone=auth_limit burst=5 nodelay;
        }
    }
    
    location /api/user {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v1";
        
        # Special rate limiting for auth endpoints
        if ($request_uri ~* "/api/user/login|/api/user$") {
            limit_req zone=auth_limit burst=5 nodelay;
        }
    }
    
    # Chat Service Routes with Versioning Support
    location ~ ^/api/v(\d+)/chat {
        set $version $1;
        limit_req zone=api_limit burst=20 nodelay;
        
        rewrite ^/api/v\d+/(.*)$ /api/$1 break;
        
        proxy_pass http://chat_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v$version";
    }
    
    location /api/chat {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://chat_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v1";
    }
    
    # Message Service Routes (REST API) with Versioning Support
    location ~ ^/api/v(\d+)/message {
        set $version $1;
        limit_req zone=api_limit burst=20 nodelay;
        
        rewrite ^/api/v\d+/(.*)$ /api/$1 break;
        
        proxy_pass http://message_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v$version";
    }
    
    location /api/message {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://message_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v1";
    }
    
    # Workspace Service Routes with Versioning Support
    location ~ ^/api/v(\d+)/workspace {
        set $version $1;
        limit_req zone=api_limit burst=20 nodelay;
        
        rewrite ^/api/v\d+/(.*)$ /api/$1 break;
        
        proxy_pass http://workspace_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v$version";
    }
    
    location /api/workspace {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://workspace_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v1";
    }
    
    # Task Service Routes with Versioning Support
    location ~ ^/api/v(\d+)/tasks {
        set $version $1;
        limit_req zone=api_limit burst=20 nodelay;
        
        rewrite ^/api/v\d+/(.*)$ /api/$1 break;
        
        proxy_pass http://task_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v$version";
    }
    
    location /api/tasks {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://task_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v1";
    }
    
    # Notification Service Routes with Versioning Support
    location ~ ^/api/v(\d+)/notification {
        set $version $1;
        limit_req zone=api_limit burst=20 nodelay;
        
        rewrite ^/api/v\d+/(.*)$ /api/$1 break;
        
        proxy_pass http://notification_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v$version";
    }
    
    location /api/notification {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://notification_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v1";
    }
    
    # WebSocket support for Socket.IO (message-service)
    location /socket.io/ {
        proxy_pass http://message_service;
        proxy_http_version 1.1;
        
        # WebSocket specific headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    
    # Default route - return 404
    location / {
        return 404 '{"error": "Route not found", "message": "Please use /api/{service} endpoints"}\n';
        add_header Content-Type application/json;
    }
}


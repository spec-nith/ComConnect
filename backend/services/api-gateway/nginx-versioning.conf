# API Gateway Nginx Configuration with Versioning Support
# This is an example of how to add versioning support to the API Gateway

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# Upstream services
upstream user_service {
    server user-service:5001;
    keepalive 32;
}

# ... other upstreams ...

# Main server block
server {
    listen 80;
    server_name api-gateway;
    
    # ... existing config ...
    
    # User Service Routes with Versioning
    location ~ ^/api/v(\d+)/user {
        set $version $1;
        limit_req zone=api_limit burst=20 nodelay;
        
        # Rewrite to remove version for service routing
        rewrite ^/api/v\d+/(.*)$ /api/$1 break;
        
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v$version";
    }
    
    # Default version (v1) for backward compatibility
    location /api/user {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Version "v1";
    }
    
    # ... other routes ...
}


name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag
        required: false
        default: latest

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-aws
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: production
      TF_VAR_image_tag: ${{ inputs.image_tag || github.sha }}
      TF_VAR_mongo_uri: ${{ secrets.MONGO_URI }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_kafka_broker: ${{ secrets.KAFKA_BROKER }}
      TF_VAR_kafka_username: ${{ secrets.KAFKA_USERNAME }}
      TF_VAR_kafka_password: ${{ secrets.KAFKA_PASSWORD }}
      TF_VAR_firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Initialize Terraform
        working-directory: infra/aws
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=comconnect/production.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Bootstrap container registries
        working-directory: infra/aws
        run: terraform apply -auto-approve -target=aws_ecr_repository.repository

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push service images
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          build_push() {
            local name="$1"
            local dockerfile="$2"
            docker build -f "$dockerfile" -t "$REGISTRY/comconnect-production-$name:$IMAGE_TAG" .
            docker push "$REGISTRY/comconnect-production-$name:$IMAGE_TAG"
          }

          build_push gateway gateway/Dockerfile
          build_push identity backend/dockerfiles/identity.Dockerfile
          build_push chat backend/dockerfiles/chat.Dockerfile
          build_push message-worker backend/dockerfiles/message-worker.Dockerfile
          build_push knowledge-indexer backend/dockerfiles/knowledge-indexer.Dockerfile
          build_push tasks backend/dockerfiles/tasks.Dockerfile
          build_push notifications backend/dockerfiles/notifications.Dockerfile
          build_push ai-orchestrator backend/dockerfiles/ai-orchestrator.Dockerfile
          build_push ai-engine ai-service/Dockerfile

      - name: Apply AWS infrastructure
        working-directory: infra/aws
        run: terraform apply -auto-approve

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "true"
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Publish frontend and invalidate CloudFront
        working-directory: infra/aws
        run: |
          BUCKET="$(terraform output -raw frontend_bucket)"
          DISTRIBUTION="$(terraform output -raw cloudfront_distribution_id)"
          aws s3 sync ../../frontend/build "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"
